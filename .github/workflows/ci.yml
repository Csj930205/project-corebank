# push·PR 마다 컴파일하고 전체 테스트를 돌린다. main 에 push 하면 테스트를 통과한 jar 로 서버 이미지를 만들어 GHCR 에 올린다.
# 테스트는 Testcontainers 로 실제 Oracle(gvenzl/oracle-free)을 띄운다. GitHub 의 Ubuntu 러너에는 Docker 가 있어 따로 설정할 것이 없다.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 같은 브랜치에 새로 push 하면 앞서 돌던 실행은 취소한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      # Gradle 과 의존성 캐시
      - uses: gradle/actions/setup-gradle@v5

      - name: Build and test
        run: ./gradlew build --console=plain

      # 실패했을 때 어떤 테스트가 왜 깨졌는지 HTML 리포트로 내려받아 볼 수 있게 남긴다.
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7

  # 배포 이미지. main 에 push 했고 테스트가 통과했을 때만. PR 에서는 만들지 않는다.
  # 태그: 커밋 sha(그 버전으로 배포·되돌리기)와 latest(main 의 마지막 성공 빌드). 배포는 deploy/deploy.sh.
  image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/project-corebank
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v5

      # 테스트는 앞 작업에서 통과했다. 같은 커밋의 코드로 jar 만 만든다.
      - name: Build jar
        run: ./gradlew bootJar --console=plain

      # 이미지는 amd64(서버)와 arm64(Apple Silicon 개발 PC) 둘 다 만든다. jar 를 복사할 뿐이라 금방 끝난다.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name (lowercase)
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
