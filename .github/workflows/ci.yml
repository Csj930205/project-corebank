# push·PR 마다 컴파일하고 전체 테스트를 돌린다.
# 테스트는 Testcontainers 로 실제 Oracle(gvenzl/oracle-free)을 띄운다. GitHub 의 Ubuntu 러너에는 Docker 가 있어 따로 설정할 것이 없다.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 같은 브랜치에 새로 push 하면 앞서 돌던 실행은 취소한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      # Gradle 과 의존성 캐시
      - uses: gradle/actions/setup-gradle@v5

      - name: Build and test
        run: ./gradlew build --console=plain

      # 실패했을 때 어떤 테스트가 왜 깨졌는지 HTML 리포트로 내려받아 볼 수 있게 남긴다.
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7
