# 테스트 전용 설정. 테스트 클래스패스에만 있어, 프로필을 따로 지정하지 않은 테스트(= default 프로필)에서만 읽힌다.
# 운영·개발 서버(bootRun)는 이 파일을 보지 않고 .env 의 값을 쓴다.
corebank.jwt.secret=test-only-jwt-secret-0123456789-abcdefghij
corebank.admin.username=test-admin
corebank.admin.password=test-admin-password-1234
# 테스트 중 자동 마감이 끼어들지 않게 스케줄러를 끈다. 마감 테스트는 서비스를 직접 호출한다.
corebank.closing.scheduler.enabled=false
