# DB 마이그레이션(MigrationApplication) 전용 설정. 서버(application.properties)와 따로 읽는다.
# 테이블 소유자 계정으로 접속해 Flyway 마이그레이션만 하고 끝난다. 소유자 비밀번호는 이 설정에만 필요하다.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
spring.datasource.username=${DB_OWNER_USERNAME}
spring.datasource.password=${DB_OWNER_PASSWORD}
spring.datasource.hikari.maximum-pool-size=2

# R__app_user_grants.sql 의 ${app_user}: 권한을 받을 앱 계정
spring.flyway.placeholders.app_user=${DB_APP_USERNAME}
