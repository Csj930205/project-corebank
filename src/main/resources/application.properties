spring.application.name=project-corebank
# 프로젝트 폴더의 .env 파일이 있으면 설정으로 읽는다. 비밀번호를 코드 저장소에 넣지 않기 위해서다.
spring.config.import=optional:file:.env[.properties]

# compose.yaml 로 띄운 Oracle 에 접속한다. FREEPDB1 은 Oracle Free 의 기본 데이터베이스(PDB) 이름이다.
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/FREEPDB1
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# 금액에 1.5 같은 소수가 들어오면 1로 잘라 받지 않고 거부한다.
spring.jackson.deserialization.accept-float-as-int=false

# 테이블은 Flyway 가 만들고, JPA 는 엔티티와 테이블이 일치하는지 검사만 한다. 다르면 앱이 시작되지 않는다.
spring.jpa.hibernate.ddl-auto=validate

# JWT 서명 키(32바이트 이상)와 첫 관리자 계정. 값은 .env 에만 둔다. 없으면 서버가 시작되지 않거나(JWT) 관리자를 만들지 않는다.
corebank.jwt.secret=${JWT_SECRET:}
corebank.admin.username=${ADMIN_USERNAME:}
corebank.admin.password=${ADMIN_PASSWORD:}

# 일 마감 배치(Spring Batch).
# 서버가 시작할 때 등록된 잡을 자동 실행하지 않는다. 마감은 스케줄러나 관리자 API 로만 시작한다.
spring.batch.job.enabled=false
# BATCH_* 테이블은 Flyway(V9)가 만든다.
spring.batch.jdbc.initialize-schema=never
# 자동 마감 시각(초 분 시 일 월 요일). 매일 00:10 에 전날을 마감한다.
corebank.closing.cron=0 10 0 * * *

# 횟수 제한. 기록은 DB(login_attempt, rate_limit)에 남아 서버가 여러 대여도 같은 기준으로 센다.
# 로그인: 아이디마다 연속 실패가 이만큼이면 잠근다. 성공하면 처음부터 센다. 관리자가 POST /admin/login-locks/{username}/unlock 으로 미리 풀 수 있다.
corebank.login.max-failures=5
corebank.login.lock-duration=15m
# 수취인 조회: 고객마다 구간 안에 최대 이만큼(관리자는 제한 없음, 감사 로그에는 남는다)
corebank.rate-limit.recipient-lookup.max=30
corebank.rate-limit.recipient-lookup.window=1h
