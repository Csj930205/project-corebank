# 개발용 Oracle DB. 실행: docker compose up -d --wait
# 아래 migrate·app 은 배포용(deploy 프로필)이라 위 명령으로는 뜨지 않는다. 배포는 deploy/deploy.sh.
services:
  oracle:
    # 이미지 버전을 고정해 실행할 때마다 같은 환경을 쓴다. 테스트 설정도 같은 버전을 쓴다.
    image: gvenzl/oracle-free:23.26.3-slim-faststart
    ports:
      - "1521:1521"
    # 값은 .env 에서 읽는다. .env 가 없으면 안내 메시지를 보여 주고 실행을 멈춘다.
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?copy .env.example to .env}
      # 테이블 소유자. 이미지가 DB 를 처음 만들 때 이 계정을 만든다.
      APP_USER: ${DB_OWNER_USERNAME:?copy .env.example to .env}
      APP_USER_PASSWORD: ${DB_OWNER_PASSWORD:?copy .env.example to .env}
      # 앱 실행 계정. docker/oracle-init/01-create-app-user.sh 가 만든다.
      DB_APP_USERNAME: ${DB_APP_USERNAME:?copy .env.example to .env}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?copy .env.example to .env}
    # 컨테이너를 지워도 데이터가 남도록 볼륨에 저장한다.
    volumes:
      - oracle-data:/opt/oracle/oradata
      # DB 를 처음 만들 때 실행할 스크립트(앱 계정 생성)
      - ./docker/oracle-init:/container-entrypoint-initdb.d:ro
    # DB 가 접속 가능한 상태인지 확인한다. --wait 옵션은 이 검사가 통과할 때까지 기다린다.
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30

  # ───── 배포(deploy 프로필). deploy/deploy.sh 가 쓴다. "docker compose up -d" (개발)에서는 뜨지 않는다. ─────
  # 이미지는 CI 가 GHCR 에 올린 것(COREBANK_IMAGE 로 태그 지정, deploy.sh 가 정한다).
  # 계정 분리: 마이그레이션 컨테이너만 소유자 비밀번호를 받고, 서버 컨테이너는 앱 계정만 받는다.

  # DB 마이그레이션. 한 번 실행하고 끝난다.
  migrate:
    profiles: [deploy]
    image: ${COREBANK_IMAGE:-ghcr.io/csj930205/project-corebank:latest}
    command: ["migrate"]
    environment:
      DB_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      DB_OWNER_USERNAME: ${DB_OWNER_USERNAME}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD}
      DB_APP_USERNAME: ${DB_APP_USERNAME}
    depends_on:
      oracle:
        condition: service_healthy

  # 서버. 마이그레이션이 성공해야 시작한다.
  app:
    profiles: [deploy]
    image: ${COREBANK_IMAGE:-ghcr.io/csj930205/project-corebank:latest}
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      DB_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      DB_APP_USERNAME: ${DB_APP_USERNAME}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
      # 스키마 이름으로만 쓴다. 소유자 비밀번호는 주지 않는다.
      DB_OWNER_USERNAME: ${DB_OWNER_USERNAME}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      APPROVER_USERNAME: ${APPROVER_USERNAME}
      APPROVER_PASSWORD: ${APPROVER_PASSWORD}
    depends_on:
      oracle:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  oracle-data:
